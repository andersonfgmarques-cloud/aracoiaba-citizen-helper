name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/pwa-responsiva
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Install Pillow for PWA icon generation
        run: python -m pip install --user Pillow

      - name: Prepare PWA icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/android-chrome-192x192.png")
          target_dir = Path("dist/client")
          target_dir.mkdir(parents=True, exist_ok=True)
          with Image.open(source) as image:
              rgba = image.convert("RGBA")
              rgba.resize((192, 192), Image.Resampling.LANCZOS).save(target_dir / "android-chrome-192x192.png", "PNG")
              rgba.resize((512, 512), Image.Resampling.LANCZOS).save(target_dir / "android-chrome-512x512.png", "PNG")
          PY
          test -f public/android-chrome-192x192.png
          test -f dist/client/android-chrome-192x192.png
          test -f dist/client/android-chrome-512x512.png

      - name: Fix project-site asset paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("dist/client")
          # GitHub Pages project sites live under /<repository>/, not the domain root.
          # Rewrite HTML and bundled JS/CSS too, because dynamic imports can contain
          # root-relative /assets/ URLs even when the HTML entry points are corrected.
          for pattern in ("*.html", "*.js", "*.css"):
              for path in root.rglob(pattern):
                  text = path.read_text(encoding="utf-8")
                  # Rewrite every occurrence, including dynamic-import chunk URLs emitted by the bundler.
                  text = re.sub(r"(?<![A-Za-z0-9_-])/assets/", "/aracoiaba-citizen-helper/assets/", text)
                  text = text.replace('="/favicon.ico"', '="/aracoiaba-citizen-helper/favicon.ico"')
                  # PWA links must also stay under the repository subpath.
                  for filename in ("manifest.webmanifest", "sw.js", "android-chrome-192x192.png", "android-chrome-512x512.png"):
                      text = text.replace(f'="/{filename}"', f'="/aracoiaba-citizen-helper/{filename}"')
                      text = text.replace(f'="/{filename}?', f'="/aracoiaba-citizen-helper/{filename}?')
                      text = text.replace(f'"/{filename}"', f'"/aracoiaba-citizen-helper/{filename}"')
                  path.write_text(text, encoding="utf-8")

          # Fail the build if assets or PWA entry points still target the domain root.
          for pattern in ("*.html", "*.js", "*.css"):
              for path in root.rglob(pattern):
                  text = path.read_text(encoding="utf-8")
                  assert not re.search(r"(?<!aracoiaba-citizen-helper)/assets/", text), f"Root-relative asset path remains in {path}"
                  for filename in ("manifest.webmanifest", "sw.js", "android-chrome-192x192.png", "android-chrome-512x512.png"):
                      assert f'="/{filename}"' not in text and f'"/{filename}"' not in text, f"Root-relative PWA path remains in {path}: {filename}"
          PY

      - name: Ensure GitHub Pages fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
