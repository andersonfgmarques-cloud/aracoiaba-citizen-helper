name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Ensure GCM emblem is included in Pages output
        run: |
          test -f public/gcm-emblem.svg
          cp public/gcm-emblem.svg dist/client/gcm-emblem.svg

      - name: Fix project-site asset paths
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("dist/client")
          prefix = "/aracoiaba-citizen-helper"

          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              text = text.replace('="/assets/', '="/aracoiaba-citizen-helper/assets/')
              text = text.replace('="/favicon.ico"', '="/aracoiaba-citizen-helper/favicon.ico"')
              path.write_text(text, encoding="utf-8")
          PY

      - name: Ensure GitHub Pages fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
