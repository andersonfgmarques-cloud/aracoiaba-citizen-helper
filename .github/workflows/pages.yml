name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/pwa-responsiva
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Install Pillow for PWA icon generation
        run: python -m pip install --user Pillow

      - name: Prepare PWA icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/android-chrome-192x192.png")
          target = Path("dist/client/android-chrome-512x512.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          with Image.open(source) as image:
              image.convert("RGBA").resize((512, 512), Image.Resampling.LANCZOS).save(target, "PNG")
          PY
          test -f public/android-chrome-192x192.png
          cp public/android-chrome-192x192.png dist/client/android-chrome-192x192.png
          test -f dist/client/android-chrome-512x512.png

      - name: Fix project-site asset paths
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("dist/client")
          # GitHub Pages project sites live under /<repository>/, not the domain root.
          # Rewrite HTML and bundled JS/CSS too, because dynamic imports can contain
          # root-relative /assets/ URLs even when the HTML entry points are corrected.
          for pattern in ("*.html", "*.js", "*.css"):
              for path in root.rglob(pattern):
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("/assets/", "/aracoiaba-citizen-helper/assets/")
                  text = text.replace('="/favicon.ico"', '="/aracoiaba-citizen-helper/favicon.ico"')
                  path.write_text(text, encoding="utf-8")

          # Fail the build if bundled assets still point to the domain root.
          for pattern in ("*.html", "*.js", "*.css"):
              for path in root.rglob(pattern):
                  text = path.read_text(encoding="utf-8")
                  assert '="/assets/' not in text and "\\"/assets/" not in text, f"Root-relative asset path remains in {path}"
          PY

      - name: Ensure GitHub Pages fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
